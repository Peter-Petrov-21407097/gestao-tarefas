
<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicação pessoal de gestão e organização de tarefas.">

    <title>TaskFlow | Gestão de Tarefas</title>

    <link rel="stylesheet" href="css/styles.css">
    <script src="scripts/main.js" defer></script>
</head>

<body>

    <header>
        <h1>TaskFlow</h1>
        <p>Organiza as tuas tarefas. Gere o teu tempo.</p>
    </header>

    <main>

        <section id="nova-tarefa">
            <h2>Adicionar tarefa</h2>

            <form id="form-nova-tarefa">

                <label for="titulo">Descrição da tarefa</label>
                <textarea
                    id="titulo"
                    placeholder="O que precisas de fazer?"
                    rows="3"
                    required
                ></textarea>

                <label for="prioridade">Prioridade</label>
                <select id="prioridade" required>
                    <option value="">Selecionar prioridade</option>
                    <option value="1">Baixa</option>
                    <option value="2">Média</option>
                    <option value="3">Alta</option>
                </select>

                <label for="data-hora">Data e hora</label>
                <input
                    type="datetime-local"
                    id="data-hora"
                    required
                >

                <label for="user">Responsável</label>
                <input
                    type="text"
                    id="user"
                    placeholder="Nome do responsável"
                    required
                >

                <button type="submit">Adicionar tarefa</button>

            </form>
        </section>

        <section id="estatisticas">
            <h2>Resumo das tarefas</h2>

            <ul>
                <li>
                    <span>Total</span>
                    <strong id="total-tarefas">0</strong>
                </li>

                <li>
                    <span>Pendentes</span>
                    <strong id="tarefas-pendentes">0</strong>
                </li>

                <li>
                    <span>Concluídas</span>
                    <strong id="tarefas-concluidas">0</strong>
                </li>
            </ul>
        </section>

        <section id="lista-tarefas">
    <h2>As minhas tarefas</h2>

    <div id="filtros">

        <div class="filtro-pesquisa">
            <label for="pesquisa">Pesquisar</label>
            <input
                type="search"
                id="pesquisa"
                placeholder="Procurar tarefa..."
            >
        </div>

        <div class="filtro">
            <label for="filtro-prioridade">Prioridade</label>
            <select id="filtro-prioridade">
                <option value="todas">Todas</option>
                <option value="1">Baixa</option>
                <option value="2">Média</option>
                <option value="3">Alta</option>
            </select>
        </div>

        <div class="filtro">
            <label for="filtro-estado">Estado</label>
            <select id="filtro-estado">
                <option value="todos">Todos</option>
                <option value="pendente">Pendente</option>
                <option value="concluida">Concluída</option>
            </select>
        </div>

        <div class="filtro">
            <label for="filtro-data">Data</label>
            <select id="filtro-data">
                <option value="todas">Todas</option>
                <option value="hoje">Hoje</option>
                <option value="semana">Próximos 7 dias</option>
                <option value="atrasadas">Datas ultrapassadas</option>
                <option value="sem-data">Sem data</option>
            </select>
        </div>

    </div>
</section>

    </main>

    <dialog id="modal-editar">

        <h2>Editar tarefa</h2>

        <form id="form-editar">

            <input type="hidden" id="edit-id">

            <label for="edit-titulo">Descrição</label>
            <textarea
                id="edit-titulo"
                rows="3"
                required
            ></textarea>

            <label for="edit-prioridade">Prioridade</label>
            <select id="edit-prioridade" required>
                <option value="1">Baixa</option>
                <option value="2">Média</option>
                <option value="3">Alta</option>
            </select>

            <label for="edit-data-hora">Data e hora</label>
            <input
                type="datetime-local"
                id="edit-data-hora"
                required
            >

            <label for="edit-user">Responsável</label>
            <input
                type="text"
                id="edit-user"
                required
            >

            <button type="submit">Guardar alterações</button>
            <button type="button" id="fechar-modal">Cancelar</button>

        </form>

    </dialog>

    <dialog id="modal-apagar">

        <h2>Eliminar tarefa</h2>

        <p>Tens a certeza de que pretendes eliminar esta tarefa?</p>

        <button type="button" id="confirmar-apagar">Eliminar</button>
        <button type="button" id="cancelar-apagar">Cancelar</button>

    </dialog>

    <footer>
        <p>TaskFlow &copy; 2026 | Projeto pessoal | Pedro Santos</p>
    </footer>

</body>

</html>
